name: Run Library Comparison

on:
  workflow_dispatch: # Allows you to trigger it manually from the Actions tab

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run comparison script
        env:
          ADS_DEV_KEY: ${{ secrets.ADS_DEV_KEY }}
        run: python compare_library.py

      - name: Upload analysis artifact
        uses: actions/upload-artifact@v3
        with:
          name: missing-papers-report
          path: docs/missing_analysis.json
