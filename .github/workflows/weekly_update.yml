name: Weekly ADS Library Update

on:
  schedule:
    # Runs every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  # Allows you to manually trigger the script anytime from the GitHub interface
  workflow_dispatch:

jobs:
  update-library:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute ADS Update Script
        env:
          ADS_DEV_KEY: ${{ secrets.ADS_DEV_KEY }}
        run: |
          python update_library.py

      

      - name: Commit and Push updated data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git commit -m "Auto-update publications data.json" || exit 0
          git push
